spring:
  application:
    name: rbpo-2026
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rbpo2026}
    username: ${DB_USERNAME:rbpo_app}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: false
server:
  port: ${SERVER_PORT:8080}
