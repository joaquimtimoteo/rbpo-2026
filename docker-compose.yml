services:
  db:
    image: postgres:16-alpine
    container_name: rbpo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbpo2026}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-rbpo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      RBPO_APP_USER: ${DB_USERNAME:-rbpo_app}
      RBPO_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - rbpo_data:/var/lib/postgresql/data
      - ./db/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-rbpo_admin} -d ${POSTGRES_DB:-rbpo2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rbpo_data:
